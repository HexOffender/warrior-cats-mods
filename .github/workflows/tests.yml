# The game-free tests on every push and pull request: tests/unit/ under pytest (Windows, the oldest and the
# newest Python wcmods runs on; Ubuntu too, where the Windows-only parts skip), then the studio's JavaScript
# tests under Node's own runner, with the browser tests on Windows, where Edge is there to drive. The in-game
# tests (tests/game/) need the game and run on a developer's machine with `python wcmods.py agent test`.
name: tests
on: [push, pull_request]
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest
  studio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test "tests/studio/**/*.test.mjs"
